name: Update v2 branch

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Fast-forward v2 to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/v2" -f sha="$GITHUB_SHA"
