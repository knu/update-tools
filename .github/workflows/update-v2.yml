name: Update v2 branch

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  update-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Fast-forward v2 to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/v2" -f sha="$GITHUB_SHA"
